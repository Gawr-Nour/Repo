<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Controle de Estoque</title>
  <link rel="stylesheet" href="src/styles/style.css">
</head>
<body>

  <!-- TELA INICIAL: PRATELEIRA -->
  <div id="paginaPrateleira" class="pagina ativa">
    <!-- Barra de pesquisa fixa no topo -->
    <div class="topo-fixo">
      <h2>📦 Prateleira</h2>
      <input type="text" id="campoPesquisaPrateleira" placeholder="🔍 Pesquisar produto..." oninput="filtrarPrateleira()">
    </div>

    <!-- Lista de produtos na prateleira -->
    <div class="conteudo-scroll">
      <div id="listaPrateleira" class="lista-produtos"></div>
    </div>

    <!-- Botão Fixo na parte inferior -->
    <button class="btn-rodape-fixo" onclick="abrirPagina('paginaOpcoes')">⚙️ Opções & Impressão</button>
  </div>


  <!-- TELA DE OPÇÕES E FERRAMENTAS -->
  <div id="paginaOpcoes" class="pagina">
    <button class="btn-voltar" onclick="abrirPagina('paginaPrateleira')">← Voltar para Prateleira</button>
    
    <h2>Painel de Controle</h2>

    <!-- Seção Gerenciar -->
    <div class="card-gerenciar">
      <h3>🛠️ Gerenciar Estoque</h3>
      <div class="botoes-gerenciar-abas">
        <button id="btnAbaAdd" class="btn-aba ativa" onclick="mudarAbaGerenciar('add')">Adicionar</button>
        <button id="btnAbaRem" class="btn-aba" onclick="mudarAbaGerenciar('rem')">Remover</button>
      </div>

      <!-- Formulário Adicionar -->
      <div id="formAdicionar" class="form-gerenciar">
        <label>Nome do Produto:</label>
        <input type="text" id="nomeAdicionar" placeholder="Digite o nome do produto..." oninput="sugerirNomeAdicionar()">
        <div id="sugestoesAdicionar" class="caixa-sugestoes"></div>

        <label>Data de Validade:</label>
        <input type="date" id="validadeAdicionar">

        <button class="btn-acao btn-sucesso" onclick="adicionarProduto()">+ Adicionar à Prateleira</button>
      </div>

      <!-- Formulário Remover -->
      <div id="formRemover" class="form-gerenciar" style="display: none;">
        <label>Nome do Produto:</label>
        <input type="text" id="nomeRemover" placeholder="Digite o nome para buscar..." oninput="sugerirNomeRemover()">
        <div id="sugestoesRemover" class="caixa-sugestoes"></div>

        <label>Data para Remover:</label>
        <select id="selectDataRemover" disabled>
          <option value="">Informe o produto primeiro...</option>
        </select>

        <button class="btn-acao btn-perigo" onclick="removerProduto()">🗑️ Confirmar Remoção</button>
      </div>
    </div>

    <!-- Ações de Impressão e Backup -->
    <div class="painel-botoes-duplo">
      <button class="btn-opcao" onclick="abrirRelatorioA4()">🖨️ Imprimir Relatório (30 dias)</button>
      <button class="btn-opcao" onclick="abrirModalBackup()">📁 Backup (Importar / Exportar)</button>
    </div>
  </div>


  <!-- TELA DE RELATÓRIO A4 -->
  <div id="paginaRelatorio" class="pagina">
    <div class="cabecalho-relatorio-acoes no-print">
      <button class="btn-voltar" onclick="abrirPagina('paginaOpcoes')">← Voltar</button>
      <!-- Botão pequeno no canto superior direito para imprimir/salvar PDF -->
      <button id="btnImprimirPdf" class="btn-icone-imprimir" title="Imprimir / Salvar PDF" onclick="window.print()">
        🖨️ PDF
      </button>
    </div>

    <!-- Container em Formato Folha A4 -->
    <div id="folhaA4" class="folha-a4">
      <div class="a4-header">
        <h1>Relatório de Controle de Estoque</h1>
        <p>Produtos com vencimento próximo e dentro do período de 30 dias</p>
        <hr>
      </div>
      <div id="conteudoRelatorioA4"></div>
    </div>
  </div>


  <!-- MODAL POPUP BACKUP (IMPORTAR / EXPORTAR) -->
  <div id="modalBackup" class="modal-overlay" style="display: none;">
    <div class="modal-conteudo">
      <h3>📁 Backup do Banco de Dados</h3>
      <p>Escolha uma opção para gerenciar os dados do aplicativo em formato JSON:</p>
      
      <div class="modal-botoes">
        <button class="btn-acao btn-sucesso" onclick="exportarBancoJSON()">📥 Exportar JSON</button>
        <button class="btn-acao btn-alerta" onclick="importarBancoJSON()">📤 Importar JSON</button>
      </div>

      <button class="btn-fechar-modal" onclick="fecharModalBackup()">Cancelar</button>
    </div>
  </div>

  <script src="src/script.js"></script>
  <script src="src/backup.js"></script>
</body>
</html>
